<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ペアくじ</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  background: #f7f5f0;
  color: #333;
  text-align: center;
  margin: 0;
  padding: 30px 20px;
}

h1 {
  font-size: 32px;
  margin-bottom: 8px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}

.subtitle {
  color: #777;
  margin-bottom: 30px;
}

.card {
  max-width: 420px;
  margin: auto;
  background: white;
  border-radius: 24px;
  padding: 30px 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 10px;
  color: #555;
}

input[type="number"] {
  width: 100%;
  padding: 12px;
  font-size: 18px;
  border: 2px solid #ddd;
  border-radius: 12px;
  box-sizing: border-box;
  margin-bottom: 20px;
  text-align: center;
}

#number {
  font-size: 18px;
  color: #777;
}

#result {
  font-size: 100px;
  height: 130px;
  display: flex;
  align-items: center;
  justify-content: center;
}

button {
  width: 100%;
  padding: 18px;
  font-size: 20px;
  font-weight: bold;
  border: none;
  border-radius: 16px;
  background: #333;
  color: white;
  cursor: pointer;
}

button:disabled {
  background: #aaa;
}

button.next-user-btn {
  background: #4cd964;
  margin-top: 10px;
}

button.secondary-btn {
  background: #007aff;
  margin-top: 15px;
}

button.reset-btn {
  background: #8e8e93;
  margin-top: 15px;
  padding: 12px;
  font-size: 15px;
}

.note {
  margin-top: 18px;
  font-size: 14px;
  color: #888;
}

.history {
  margin-top: 25px;
  text-align: left;
  border-top: 1px solid #eee;
  padding-top: 15px;
}

.history div {
  display: flex;
  justify-content: space-between;
  padding: 8px;
  border-bottom: 1px solid #eee;
}
</style>
</head>

<body>

<h1 id="title">🎲 ペアくじ</h1>
<div class="subtitle">（ダブルタップでリセット）</div>

<div class="card">

  <!-- 設定エリア -->
  <div id="setupArea">
    <label for="memberInput">参加人数を入力してください</label>
    <input type="number" id="memberInput" min="2" value="10">
    <button onclick="startLottery()">くじを作成する</button>
  </div>

  <!-- くじ引きエリア -->
  <div id="lotteryArea" style="display: none;">
    <div id="roundInfo" style="font-weight: bold; color: #007aff; margin-bottom: 10px;">第1回目</div>
    <div id="number">1人目</div>

    <div id="result">？</div>

    <!-- くじを引くボタン -->
    <button id="drawButton" onclick="draw()">くじを引く</button>
    <!-- 次の人へ渡す（隠す）ステップ用のボタン -->
    <button id="hideButton" class="next-user-btn" style="display: none;" onclick="prepareNextUser()">確認した（画面を隠す）</button>

    <div class="note" id="noteText">
      ボタンを押してくじを引いてね！
    </div>

    <div class="history" id="history"></div>

    <!-- 2回目用ボタン -->
    <button id="nextRoundBtn" class="secondary-btn" style="display: none;" onclick="prepareNextRound()">2回目を開始する（別ペア）</button>
    <button class="reset-btn" onclick="resetApp()">人数変更・最初から</button>
  </div>

</div>

<script>
const SYMBOL_POOL = ["🌸","🍀","⭐️","🌈","🍎","🌙","⚡️","🎈","🎲","💎","🎨","⚽️","🐱","🥑"];

let totalMembers = 10;
let currentMarks = [];
let count = 0;
let roundCount = 1;
let historyPairs = [];

function startLottery() {
  const val = parseInt(document.getElementById("memberInput").value, 10);
  if (isNaN(val) || val < 2) {
    alert("2人以上の人数を入力してください。");
    return;
  }
  totalMembers = val;
  roundCount = 1;
  historyPairs = [];

  document.getElementById("setupArea").style.display = "none";
  document.getElementById("lotteryArea").style.display = "block";

  setupRound();
}

function setupRound() {
  count = 0;
  document.getElementById("roundInfo").textContent = `第${roundCount}回目`;
  document.getElementById("number").textContent = "1人目";
  document.getElementById("result").textContent = "？";
  document.getElementById("history").innerHTML = "";
  document.getElementById("drawButton").style.display = "block";
  document.getElementById("drawButton").disabled = false;
  document.getElementById("drawButton").textContent = "くじを引く";
  document.getElementById("hideButton").style.display = "none";
  document.getElementById("nextRoundBtn").style.display = "none";

  let valid = false;
  let attempts = 0;
  while (!valid && attempts < 100) {
    attempts++;
    currentMarks = generateMarks(totalMembers);
    valid = checkValidity(currentMarks);
  }
}

function generateMarks(num) {
  let list = [];
  let symbolIdx = 0;
  let rem = num;

  while (rem > 0) {
    const symbol = SYMBOL_POOL[symbolIdx % SYMBOL_POOL.length];
    if (rem === 3) {
      list.push(symbol, symbol, symbol);
      rem -= 3;
    } else {
      list.push(symbol, symbol);
      rem -= 2;
      symbolIdx++;
    }
  }

  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

function checkValidity(marksList) {
  if (historyPairs.length === 0) return true;

  const groups = {};
  marksList.forEach((mark, idx) => {
    if (!groups[mark]) groups[mark] = [];
    groups[mark].push(idx);
  });

  for (let mark in groups) {
    const group = groups[mark];
    for (let pastSet of historyPairs) {
      let matchCount = 0;
      for (let memberIdx of group) {
        if (pastSet.has(memberIdx)) matchCount++;
      }
      if (matchCount >= 2) return false;
    }
  }
  return true;
}

// くじを引く動作
function draw() {
  const mark = currentMarks[count];
  count++;

  document.getElementById("result").textContent = mark;

  const history = document.getElementById("history");
  history.innerHTML +=
    "<div><span>" + count + "人目</span><strong>" + mark + "</strong></div>";

  document.getElementById("drawButton").style.display = "none";

  if (count < totalMembers) {
    // まだ残りの人がいる場合、「確認した（隠す）」ボタンを表示
    document.getElementById("hideButton").style.display = "block";
  } else {
    // 全員引いた場合
    document.getElementById("number").textContent = "全員終了！🎉";
    saveCurrentPairs();
    document.getElementById("nextRoundBtn").style.display = "block";
  }
}

// 次の人へ交代する際、画面をリセット（？に戻す）するワンステップ
function prepareNextUser() {
  document.getElementById("result").textContent = "？";
  document.getElementById("number").textContent = (count + 1) + "人目";
  document.getElementById("hideButton").style.display = "none";
  document.getElementById("drawButton").style.display = "block";
}

function saveCurrentPairs() {
  const groups = {};
  currentMarks.forEach((mark, idx) => {
    if (!groups[mark]) groups[mark] = [];
    groups[mark].push(idx);
  });
  for (let mark in groups) {
    historyPairs.push(new Set(groups[mark]));
  }
}

function prepareNextRound() {
  roundCount++;
  setupRound();
}

function resetApp() {
  document.getElementById("setupArea").style.display = "block";
  document.getElementById("lotteryArea").style.display = "none";
}

let lastTap = 0;
document.getElementById("title").addEventListener("click", function(e) {
  const currentTime = new Date().getTime();
  const tapLength = currentTime - lastTap;
  if (tapLength < 300 && tapLength > 0) {
    resetApp();
    e.preventDefault();
  }
  lastTap = currentTime;
});
</script>

</body>
</html>
