<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ペアくじ</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f7f5f0;
      color: #333;
      text-align: center;
      margin: 0;
      padding: 30px 20px;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 8px;
      cursor: pointer;
      user-select: none;
    }
    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 24px;
    }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      max-width: 400px;
      margin: 0 auto 20px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      text-align: left;
    }
    input[type="number"] {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      margin-bottom: 16px;
    }
    button {
      background-color: #007aff;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
    button:active {
      opacity: 0.8;
    }
    #result {
      margin-top: 20px;
      font-size: 18px;
      text-align: left;
    }
    .pair-item {
      background: #f9f9f9;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      border-left: 4px solid #007aff;
    }
  </style>
</head>
<body>

  <!-- ダブルタップ/ダブルクリックでリセットを実行 -->
  <h1 id="title" ondblclick="resetApp()">ペアくじ</h1>
  <div class="subtitle">（タイトルをダブルタップでリセット）</div>

  <div class="card">
    <label for="memberCount">参加人数</label>
    <!-- 人数を都度変更可能 -->
    <input type="number" id="memberCount" min="2" value="4" placeholder="人数を入力">

    <button onclick="generatePairs()">ペアを作成する</button>

    <div id="result"></div>
  </div>

  <script>
    function generatePairs() {
      const countInput = document.getElementById('memberCount');
      const count = parseInt(countInput.value, 10);
      const resultDiv = document.getElementById('result');

      if (isNaN(count) || count < 2) {
        alert('2人以上の人数を入力してください。');
        return;
      }

      // 参加者リストの生成（例: 1番〜N番）
      let members = [];
      for (let i = 1; i <= count; i++) {
        members.push(`参加者 ${i}`);
      }

      // シャッフル（フィッシャー–イエーツのシャッフル）
      for (let i = members.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [members[i], members[j]] = [members[j], members[i]];
      }

      // ペア組みの出力
      let html = '<h3>結果</h3>';
      let groupIndex = 1;
      for (let i = 0; i < members.length; i += 2) {
        if (i + 1 < members.length) {
          html += `<div class="pair-item">グループ ${groupIndex}: ${members[i]} & ${members[i+1]}</div>`;
        } else {
          html += `<div class="pair-item">グループ ${groupIndex}: ${members[i]}（あまり）</div>`;
        }
        groupIndex++;
      }

      resultDiv.innerHTML = html;
    }

    // ダブルタップ / ダブルクリック時のリセット処理
    function resetApp() {
      document.getElementById('memberCount').value = 4;
      document.getElementById('result').innerHTML = '';
      alert('リセットしました。');
    }
  </script>

</body>
</html>
